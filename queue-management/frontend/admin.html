<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hàng Đợi - Quản Trị</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản Trị Hệ Thống</h1>
        <div class="stats">
            <div>
                <span>Số lượt phục vụ hôm nay:</span>
                <span id="served-count" class="highlight">--</span>
            </div>
            <div>
                <span>Thời gian chờ trung bình:</span>
                <span id="avg-wait-time">-- phút</span>
            </div>
        </div>
        <div class="queue-management">
            <h2>Quản lý hàng đợi</h2>
            <ul id="admin-waiting-list"></ul>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        window.pageRole = 'admin';
    </script>
</body>
</html>
