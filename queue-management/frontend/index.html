<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hàng Đợi - Khách Hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản Lý Hàng Đợi</h1>
        <div class="queue-info">
            <div class="current-number">
                <span>Số đang phục vụ:</span>
                <span id="current-serving" class="highlight">--</span>
            </div>
            <div class="waiting-list">
                <h2>Danh sách chờ</h2>
                <ul id="waiting-list"></ul>
            </div>
            <div class="estimate">
                <span>Thời gian chờ dự kiến:</span>
                <span id="estimate-time">-- phút</span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        window.pageRole = 'customer';
    </script>
</body>
</html>
