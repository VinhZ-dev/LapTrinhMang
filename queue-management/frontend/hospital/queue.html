<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lịch - Hệ thống bệnh viện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #2563eb;
            --primary-blue-light: #3b82f6;
            --primary-blue-dark: #1d4ed8;
            --secondary-blue: #e0f2fe;
            --accent-blue: #0ea5e9;
            --light-blue: #f0f9ff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--light-blue) 0%, var(--secondary-blue) 50%, #bfdbfe 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
            animation: backgroundFloat 30s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: fadeInLeft 1s ease-out 0.2s both;
        }

        .logo-icon {
    width: 40px;
    height: 40px;
    object-fit: contain;
    transition: all 0.3s ease;
    filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.1));
}

.logo-icon:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 4px 8px rgba(37, 99, 235, 0.2));
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .logo-icon {
        width: 35px;
        height: 35px;
    }
}

@media (max-width: 640px) {
    .logo-icon {
        width: 30px;
        height: 30px;
    }
}


        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-blue);
            letter-spacing: -0.025em;
        }

        .nav {
            display: flex;
            gap: 0.5rem;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .nav-link {
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover {
            color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.05);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeInRight 1s ease-out 0.6s both;
        }

        .user-info {
            padding: 0.5rem 1rem;
            background: var(--gray-100);
            border-radius: 8px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout {
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Main Content */
        .main {
            padding: 2rem 0;
        }

        .section {
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }

        .section-header p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Queue Container */
        .queue-container {
            max-width: 100%;
        }

        .queue-filters {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            animation: slideInUp 0.6s ease-out;
        }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-select {
            min-width: 200px;
            padding: 0.75rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--white);
            transition: all 0.3s ease;
            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .refresh-button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .refresh-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .refresh-button:hover::before {
            left: 100%;
        }

        .refresh-button:hover {
            background: linear-gradient(135deg, var(--primary-blue-dark), var(--primary-blue));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .refresh-button.loading {
            pointer-events: none;
        }

        .refresh-button.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Queue Grid */
        .queue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
            gap: 2rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Queue Card */
        .queue-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
        }

        .queue-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-blue), var(--primary-blue-light));
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .queue-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-xl);
        }

        .queue-card h4 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .queue-card h4::before {
            content: '🏥';
            font-size: 1.75rem;
        }

        /* Current Serving Section */
        .current-serving {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 2px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .current-serving::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--success), #059669);
        }

        .current-serving-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .current-serving-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .current-serving-patient {
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .current-serving-time {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Queue Detail Table */
        .queue-detail-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            margin-bottom: 1rem;
        }

        .queue-detail-table th,
        .queue-detail-table td {
            padding: 1rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
            transition: all 0.3s ease;
        }

        .queue-detail-table th {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .queue-detail-table th:first-child {
            border-top-left-radius: 16px;
        }

        .queue-detail-table th:last-child {
            border-top-right-radius: 16px;
        }

        .queue-detail-table tbody tr {
            transition: all 0.3s ease;
            position: relative;
        }

        .queue-detail-table tbody tr:hover {
            background: var(--light-blue);
            transform: scale(1.01);
        }

        .queue-detail-table tbody tr:nth-child(even) {
            background: var(--gray-50);
        }

        .queue-detail-table tbody tr.serving-row {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05)) !important;
            border-left: 4px solid var(--success);
        }

        .queue-detail-table tbody tr:last-child td:first-child {
            border-bottom-left-radius: 16px;
        }

        .queue-detail-table tbody tr:last-child td:last-child {
            border-bottom-right-radius: 16px;
        }

        /* Status Badges */
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-badge.serving {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.waiting {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-badge.next {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-blue);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        /* Position Badge */
        .position-badge {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        /* Button Styles */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-blue-dark), var(--primary-blue));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--success), #059669);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Queue List (Alternative layout) */
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .queue-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            border-left: 4px solid var(--gray-200);
        }

        .queue-list li:hover {
            transform: translateX(8px);
            box-shadow: var(--shadow-md);
        }

        .queue-list li.next-patient {
            border-left-color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.05);
        }

        .patient-info {
            display: flex;
            flex-direction: column;
        }

        .patient-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .patient-time {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            color: var(--primary-blue);
        }

        .empty-state h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: var(--shadow-xl);
            z-index: 10000;
            transform: translateX(100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success), #059669);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--error), #dc2626);
        }

        .toast.warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
        }

        /* Loading Animation */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 1s ease-in-out infinite;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 0 1rem;
            }
            
            .queue-grid {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .main {
                padding: 1rem 0;
            }
            
            .section-header h2 {
                font-size: 1.875rem;
            }
            
            .queue-filters {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .filter-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            
            .filter-select {
                min-width: auto;
            }
            
            .queue-card {
                padding: 1.5rem;
            }
            
            .queue-detail-table {
                font-size: 0.875rem;
            }
            
            .queue-detail-table th,
            .queue-detail-table td {
                padding: 0.75rem 0.5rem;
            }
        }

        @media (max-width: 640px) {
            .nav-link {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
            
            .user-menu {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .queue-detail-table {
                font-size: 0.8rem;
            }
            
            .queue-detail-table th,
            .queue-detail-table td {
                padding: 0.5rem 0.25rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        /* Animation keyframes */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Staggered animations */
        .queue-card:nth-child(1) { animation-delay: 0.1s; }
        .queue-card:nth-child(2) { animation-delay: 0.2s; }
        .queue-card:nth-child(3) { animation-delay: 0.3s; }
        .queue-card:nth-child(4) { animation-delay: 0.4s; }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-blue), var(--primary-blue-light));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--primary-blue-dark), var(--primary-blue));
        }

        /* Pulse animation for urgent items */
        @keyframes urgentPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
        }

        .urgent-item {
            animation: urgentPulse 2s infinite;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
              <div class="logo">
                <img src="https://cdn.prod.website-files.com/63a9fb94e473f36dbe99c1b1/67d04afaede8127aa5b9853c_AD_4nXfYK_3nS8dX0rE9NKz81i9My2x-fchDiHNhbKv-i7YSBhZ3qCrOe7rCGpiCiS3rh7MbB11b3xAhQ-r3szudZNkuo5Ay6K6Wx_OQ4M41S_NNc2GNQfcrTkt9qYXnXPnMjyoqgaVk.png" alt="Hospital Logo" class="logo-icon">
                <h1>Bệnh Viện Đa Khoa</h1>
            </div>
            
                <nav class="nav">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-chart-line"></i>
                        Hàng đợi
                    </a>
                    <a href="queue.html" class="nav-link active">
                        <i class="fas fa-calendar-plus"></i>
                        Đặt lịch
                    </a>
                    <a href="appointments.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i>
                        Lịch hẹn
                    </a>
                    <a href="departments.html" class="nav-link">
                        <i class="fas fa-building"></i>
                        Khoa phòng
                    </a>
                    <a href="users.html" class="nav-link" id="user-nav-link">
                        <i class="fas fa-user-cog"></i>
                        Người dùng
                    </a>
                </nav>
                <div class="user-menu">
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="current-user"></span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="section active">
                <div class="section-header">
                    <h2>Hàng đợi khám bệnh</h2>
                    <p>Quản lý xác nhận lịch hẹn và phục vụ bệnh nhân theo hàng đợi</p>
                </div>
                <div id="waiting-appointments-container"></div>
                <div id="queue-grid"></div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Authentication and role management
        const token = localStorage.getItem('token');
        let role = localStorage.getItem('role');
        
        if (!token) window.location.href = 'login.html';
        
        document.getElementById('current-user').innerText = role ? role.charAt(0).toUpperCase() + role.slice(1) : '';
        
        if (role !== 'admin' && role !== 'doctor') {
            const userNav = document.getElementById('user-nav-link');
            if (userNav) {
                userNav.innerHTML = '<i class="fas fa-user"></i> Thông tin cá nhân';
            }
        }

        // Enhanced toast notification system
        function showToast(msg, type = 'info', duration = 3000) {
            // Remove existing toast
            const existingToast = document.getElementById('toast');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-times-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `
                <i class="${icons[type] || icons.info}"></i>
                <span>${msg}</span>
            `;
            
            document.body.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 100);
            
            // Auto remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Enhanced queue rendering with animations
        function renderQueue(data) {
            const grid = document.getElementById('queue-grid');
            
            if (!Array.isArray(data) || data.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-clipboard-list"></i><h3>Không có hàng đợi</h3><p>Không có dữ liệu hàng đợi.</p></div>`;
                return;
            }

            grid.innerHTML = '';
            
            data.forEach((q, index) => {
                const queueCard = document.createElement('div');
                queueCard.className = 'queue-card';
                queueCard.style.animationDelay = `${index * 0.1}s`;
                
                let currentServingHtml = '';
                if (q.current_serving) {
                    currentServingHtml = `
                        <div class="current-serving">
                            <div class="current-serving-header">
                                <div class="current-serving-title">
                                    <i class="fas fa-stethoscope"></i>
                                    Đang phục vụ
                                </div>
                                <button class="btn btn-secondary" onclick="completeQueue(${q.department_id})" title="Hoàn thành lượt khám">
                                    <i class="fas fa-check"></i>
                                    Hoàn thành
                                </button>
                            </div>
                            <div class="current-serving-patient">
                                <strong>${q.current_serving.patient_name}</strong> 
                                <span class="position-badge">#${q.current_serving.position || ''}</span>
                            </div>
                        </div>
                    `;
                }

                let tableHtml = '';
                if (q.waiting_queue && q.waiting_queue.length > 0) {
                    tableHtml = `
                        <table class="queue-detail-table">
                            <thead>
                                <tr>
                                    <th><i class="fas fa-sort-numeric-up"></i> Vị trí</th>
                                    <th><i class="fas fa-user"></i> Tên bệnh nhân</th>
                                    <th><i class="fas fa-info-circle"></i> Trạng thái</th>
                                    <th><i class="fas fa-cogs"></i> Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    q.waiting_queue.forEach((w, idx) => {
                        const isNext = idx === 0 && !q.current_serving;
                        const rowClass = isNext ? 'next-patient urgent-item' : '';
                        
                        tableHtml += `
                            <tr class="${rowClass}">
                                <td><span class="position-badge">#${w.position}</span></td>
                                <td><strong>${w.patient_name}</strong></td>
                                <td>
                                    <span class="status-badge ${isNext ? 'next' : 'waiting'}">
                                        <i class="fas fa-${isNext ? 'play' : 'clock'}"></i>
                                        ${isNext ? 'Tiếp theo' : 'Chờ xác nhận'}
                                    </span>
                                </td>
                                <td>
                                    ${isNext ? 
                                        `<button class="btn btn-primary" onclick="startQueue(${q.department_id})" title="Bắt đầu phục vụ">
                                            <i class="fas fa-play"></i>
                                            Xác nhận
                                        </button>` : 
                                        '<span class="text-muted">-</span>'
                                    }
                                </td>
                            </tr>
                        `;
                    });
                    
                    tableHtml += '</tbody></table>';
                } else {
                    tableHtml = `<div class="empty-state"><i class="fas fa-check-circle"></i><h3>Không có bệnh nhân chờ</h3><p>Tất cả bệnh nhân đã được phục vụ</p></div>`;
                }

                queueCard.innerHTML = `
                    <h4>${q.department_name}</h4>
                    ${currentServingHtml}
                    ${tableHtml}
                    <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; font-size: 0.875rem; color: var(--text-secondary);">
                        <span>
                            <i class="fas fa-users"></i>
                            Tổng cộng: <strong>${q.waiting_queue.length + (q.current_serving ? 1 : 0)}</strong> bệnh nhân
                        </span>
                        <span>
                            <i class="fas fa-clock"></i>
                            Cập nhật: ${new Date().toLocaleTimeString()}
                        </span>
                    </div>
                `;
                
                grid.appendChild(queueCard);
            });
        }

        // Enhanced department filter change handler
        // Xóa hoàn toàn mọi đoạn code liên quan đến document.getElementById('department-filter').onchange hoặc các filter không tồn tại
        // Giữ lại duy nhất logic fetchAppointments, renderAppointments, confirmAppointment như đã sửa ở các bước trước

        // Enhanced refresh queue function
        async function refreshQueue() {
            try {
                const response = await fetch('http://localhost:8000/queue/status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderQueue(data);
            } catch (error) {
                console.error('Error refreshing queue:', error);
                showToast('Không thể tải dữ liệu hàng đợi', 'error');
            }
        }

        // Queue management functions with enhanced feedback
        async function startQueue(department_id) {
            try {
                const response = await fetch(`http://localhost:8000/queue/start/${department_id}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showToast('Đã bắt đầu phục vụ bệnh nhân', 'success');
                refreshQueue();
                
            } catch (error) {
                console.error('Error starting queue:', error);
                showToast('Lỗi khi xác nhận phục vụ!', 'error');
            }
        }

        async function completeQueue(department_id) {
            try {
                const response = await fetch(`http://localhost:8000/queue/complete/${department_id}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showToast('Đã hoàn thành lượt khám', 'success');
                refreshQueue();
                
            } catch (error) {
                console.error('Error completing queue:', error);
                showToast('Lỗi khi hoàn thành lượt khám!', 'error');
            }
        }

        // WebSocket connection with enhanced error handling
        let ws;
        let wsReconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:8000/ws/queue');
                
                ws.onopen = function() {
                    console.log('WebSocket connected');
                    wsReconnectAttempts = 0;
                    showToast('Kết nối real-time thành công', 'success', 2000);
                };
                
                ws.onmessage = function(event) {
                    refreshQueue();
                    showToast('Có cập nhật mới trong hàng đợi!', 'info', 2000);
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    showToast('Lỗi kết nối real-time', 'warning');
                };
                
                ws.onclose = function(event) {
                    console.log('WebSocket disconnected');
                    
                    // Auto-reconnect with exponential backoff
                    if (wsReconnectAttempts < maxReconnectAttempts) {
                        wsReconnectAttempts++;
                        const delay = Math.pow(2, wsReconnectAttempts) * 1000;
                        
                        setTimeout(() => {
                            showToast(`Đang thử kết nối lại... (${wsReconnectAttempts}/${maxReconnectAttempts})`, 'info', 1500);
                            connectWebSocket();
                        }, delay);
                    } else {
                        showToast('Mất kết nối real-time. Vui lòng làm mới trang', 'error', 5000);
                    }
                };
                
            } catch (error) {
                console.error('Error connecting WebSocket:', error);
                showToast('Không thể kết nối real-time', 'warning');
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            fetchWaitingAppointments();
            refreshQueue();
            connectWebSocket();
            
            // Set up periodic refresh as backup
            setInterval(refreshQueue, 30000); // Refresh every 30 seconds
        });

        // Logout function
        function logout() {
            if (ws) {
                ws.close();
            }
            localStorage.clear();
            showToast('Đã đăng xuất thành công', 'info');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // F5 or Ctrl+R to refresh
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                refreshQueue();
            }
        });

        // Page visibility handling
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // Page became visible, refresh data
                refreshQueue();
            }
        });

        document.getElementById('take-queue-btn').onclick = async function() {
            const deptSelect = document.getElementById('department-filter');
            const departmentId = deptSelect.value;
            if (!departmentId) {
                showToast('Vui lòng chọn khoa để lấy số!', 'warning');
                return;
            }
            // Lấy QueueId từ backend (giả sử QueueId = departmentId, hoặc cần map lại nếu khác)
            // Lấy UserId từ token hoặc backend (giả sử đã lưu UserId trong localStorage)
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showToast('Không xác định được người dùng!', 'error');
                return;
            }
            try {
                const res = await fetch('http://localhost:8000/queue_entries', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({ QueueId: parseInt(departmentId), UserId: parseInt(userId) })
                });
                if (!res.ok) throw new Error('Lỗi khi lấy số hàng đợi');
                showToast('Lấy số thành công!', 'success');
                refreshQueue();
            } catch (err) {
                showToast('Lỗi khi lấy số hàng đợi!', 'error');
            }
        };

        let userMap = {}, departmentMap = {};
        async function fetchUsersAndDepartments() {
            const [usersRes, deptsRes] = await Promise.all([
                fetch('http://localhost:8000/users', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } }),
                fetch('http://localhost:8000/departments', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') } })
            ]);
            const users = await usersRes.json();
            const depts = await deptsRes.json();
            users.forEach(u => userMap[u.UserId] = u.FullName);
            depts.forEach(d => departmentMap[d.DepartmentId] = d.Name);
        }
        async function fetchAppointments() {
            try {
                await fetchUsersAndDepartments();
                const token = localStorage.getItem('token');
                if (!token) {
                    showToast('Bạn chưa đăng nhập hoặc token đã hết hạn!', 'error');
                    console.error('Không có token trong localStorage');
                    return;
                }
                console.log('Token sử dụng:', token);
                const res = await fetch('http://localhost:8000/appointments?status=waiting', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                console.log('Response object:', res);
                if (!res.ok) {
                    showToast('Không thể lấy danh sách lịch hẹn! (Có thể lỗi xác thực)', 'error');
                    const text = await res.text();
                    console.error('API /appointments?status=waiting trả về lỗi:', res.status, text);
                    return;
                }
                let data = await res.json();
                console.log('Dữ liệu lịch hẹn chờ xác nhận:', data);
                // Sắp xếp theo thời gian đăng ký
                data = data.sort((a, b) => new Date(a.ScheduledTime) - new Date(b.ScheduledTime));
                renderAppointments(data);
            } catch (err) {
                showToast('Lỗi khi tải lịch hẹn!', 'error');
                console.error('Lỗi fetchAppointments:', err);
            }
        }

        function renderAppointments(data) {
            const body = document.getElementById('appointments-body');
            body.innerHTML = '';
            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td colspan="5">Không có lịch hẹn chờ xác nhận</td></tr>';
                return;
            }
            data.forEach((appt, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${userMap[appt.PatientId] || appt.PatientId}</td>
                    <td>${departmentMap[appt.DepartmentId] || appt.DepartmentId}</td>
                    <td>${appt.ScheduledTime ? new Date(appt.ScheduledTime).toLocaleString() : '-'}</td>
                    <td><button class="btn btn-primary" onclick="confirmAppointment(${appt.AppointmentId})">Xác nhận</button></td>
                `;
                body.appendChild(tr);
            });
        }

        async function confirmAppointment(appointmentId) {
            try {
                const res = await fetch('http://localhost:8000/appointments/' + appointmentId + '/confirm', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Lỗi khi xác nhận lịch hẹn');
                showToast('Đã xác nhận và chuyển vào hàng đợi!', 'success');
                fetchWaitingAppointments();
                refreshQueue();
                // Gọi cập nhật dashboard nếu có
                if (window.parent && window.parent !== window && window.parent.fetchQueueStatus) {
                    window.parent.fetchQueueStatus();
                } else if (window.opener && window.opener.fetchQueueStatus) {
                    window.opener.fetchQueueStatus();
                }
            } catch (err) {
                showToast('Lỗi khi xác nhận lịch hẹn!', 'error');
            }
        }

        // Sửa lại hàm fetchWaitingAppointments để hiển thị tên bệnh nhân và tên khoa
        async function fetchWaitingAppointments() {
            const container = document.getElementById('waiting-appointments-container');
            container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Đang tải lịch hẹn chờ xác nhận...</div>';
            try {
                // Lấy userMap và departmentMap
                if (!window.userMap || !window.departmentMap) {
                    const [usersRes, deptsRes] = await Promise.all([
                        fetch('http://localhost:8000/users', { headers: { 'Authorization': 'Bearer ' + token } }),
                        fetch('http://localhost:8000/departments', { headers: { 'Authorization': 'Bearer ' + token } })
                    ]);
                    const users = await usersRes.json();
                    const depts = await deptsRes.json();
                    window.userMap = {};
                    window.departmentMap = {};
                    users.forEach(u => window.userMap[u.UserId] = u.FullName);
                    depts.forEach(d => window.departmentMap[d.DepartmentId] = d.Name);
                }
                const res = await fetch('http://localhost:8000/appointments?status=waiting', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Lỗi khi lấy lịch hẹn');
                const data = await res.json();
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-times"></i> Không có lịch hẹn chờ xác nhận</div>';
                    return;
                }
                let html = `<table class='queue-detail-table'><thead><tr><th>STT</th><th>Bệnh nhân</th><th>Khoa</th><th>Thời gian</th><th>Thao tác</th></tr></thead><tbody>`;
                data.forEach((appt, idx) => {
                    html += `<tr><td>${idx+1}</td><td>${window.userMap[appt.PatientId] || appt.PatientId}</td><td>${window.departmentMap[appt.DepartmentId] || appt.DepartmentId}</td><td>${appt.ScheduledTime ? new Date(appt.ScheduledTime).toLocaleString() : '-'}</td><td><button class='btn btn-primary' onclick='confirmAppointment(${appt.AppointmentId})'>Xác nhận</button></td></tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Lỗi khi tải lịch hẹn</div>';
            }
        }
    </script>
</body>
</html>
