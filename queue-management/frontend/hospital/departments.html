<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa phòng - Hệ thống bệnh viện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #2563eb;
            --primary-blue-light: #3b82f6;
            --primary-blue-dark: #1d4ed8;
            --secondary-blue: #e0f2fe;
            --accent-blue: #0ea5e9;
            --light-blue: #f0f9ff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --info: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--light-blue) 0%, var(--secondary-blue) 50%, #bfdbfe 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
            animation: backgroundFloat 30s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: fadeInLeft 1s ease-out 0.2s both;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.1));
        }

        .logo-icon:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 4px 8px rgba(37, 99, 235, 0.2));
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-blue);
            letter-spacing: -0.025em;
        }

        .nav {
            display: flex;
            gap: 0.5rem;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .nav-link {
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover {
            color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.05);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeInRight 1s ease-out 0.6s both;
        }

        .user-info {
            padding: 0.5rem 1rem;
            background: var(--gray-100);
            border-radius: 8px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout {
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Main Content */
        .main {
            padding: 2rem 0;
        }

        .section {
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }

        .section-header p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Departments Controls */
        .departments-controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
            animation: slideInUp 0.6s ease-out;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .controls-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .departments-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Search Filter */
        .departments-filters {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .filter-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .filter-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }

        .filter-input:focus + .filter-icon {
            color: var(--primary-blue);
            transform: translateY(-50%) scale(1.1);
        }

        .filter-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 0.75rem;
            color: var(--text-secondary);
            font-size: 1rem;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }

        .filter-stats {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Button Styles */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-blue-dark), var(--primary-blue));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--gray-300), #9ca3af);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Departments Grid */
        .departments-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 24px;
            padding: 0;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        .table-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .table-stats {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .departments-grid {
            padding: 0;
        }

        /* Departments Table */
        .dept-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--white);
        }

        .dept-table th,
        .dept-table td {
            padding: 1.25rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
            transition: all 0.3s ease;
        }

        .dept-table th {
            background: linear-gradient(135deg, var(--gray-50), var(--gray-100));
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.025em;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .dept-table tbody tr {
            transition: all 0.3s ease;
            position: relative;
        }

        .dept-table tbody tr:hover {
            background: linear-gradient(135deg, var(--light-blue), rgba(240, 249, 255, 0.5));
            transform: scale(1.005);
        }

        .dept-table tbody tr:nth-child(even) {
            background: var(--gray-50);
        }

        .dept-table tbody tr:hover:nth-child(even) {
            background: linear-gradient(135deg, var(--light-blue), rgba(240, 249, 255, 0.5));
        }

        .dept-name {
            font-weight: 600;
            color: var(--primary-blue);
            font-size: 1rem;
        }

        .dept-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-blue);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .dept-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .dept-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex !important;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            border-radius: 24px;
            padding: 0;
            min-width: 500px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 2rem;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            transition: color 0.2s ease;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }

        .form-actions {
            display: flex !important;
            justify-content: flex-end;
            gap: 1rem;
            padding: 1.5rem 0 0 0;
            margin-top: 1.5rem;
            border-top: 2px solid var(--gray-200);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            color: var(--primary-blue);
        }

        .empty-state h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            min-width: 300px;
            max-width: 400px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-light));
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-weight: 500;
            box-shadow: var(--shadow-xl);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--success), #059669);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--error), #dc2626);
        }

        .toast.warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
        }

        /* Loading Animation */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 0 1rem;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .controls-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .main {
                padding: 1rem 0;
            }
            
            .section-header h2 {
                font-size: 1.875rem;
            }
            
            .departments-controls {
                padding: 1rem;
            }

            .departments-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                min-width: auto;
            }
            
            .dept-table {
                font-size: 0.875rem;
            }
            
            .dept-table th,
            .dept-table td {
                padding: 0.75rem 1rem;
            }

            .modal-content {
                min-width: auto;
                width: 95vw;
                margin: 1rem;
            }

            .modal-body {
                padding: 1.5rem;
            }
        }

        @media (max-width: 640px) {
            .nav-link {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
            
            .user-menu {
                flex-direction: column;
                gap: 0.5rem;
            }

            .dept-table th,
            .dept-table td {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
            }

            .dept-actions {
                flex-direction: column;
                gap: 0.25rem;
            }
        }

        /* Animation keyframes */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-blue), var(--primary-blue-light));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--primary-blue-dark), var(--primary-blue));
        }

        /* Staggered table animations */
        .dept-table tbody tr:nth-child(1) { animation: slideInUp 0.3s ease-out 0.1s both; }
        .dept-table tbody tr:nth-child(2) { animation: slideInUp 0.3s ease-out 0.2s both; }
        .dept-table tbody tr:nth-child(3) { animation: slideInUp 0.3s ease-out 0.3s both; }
        .dept-table tbody tr:nth-child(4) { animation: slideInUp 0.3s ease-out 0.4s both; }
        .dept-table tbody tr:nth-child(5) { animation: slideInUp 0.3s ease-out 0.5s both; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="https://cdn.prod.website-files.com/63a9fb94e473f36dbe99c1b1/67d04afaede8127aa5b9853c_AD_4nXfYK_3nS8dX0rE9NKz81i9My2x-fchDiHNhbKv-i7YSBhZ3qCrOe7rCGpiCiS3rh7MbB11b3xAhQ-r3szudZNkuo5Ay6K6Wx_OQ4M41S_NNc2GNQfcrTkt9qYXnXPnMjyoqgaVk.png" alt="Hospital Logo" class="logo-icon">
                    <h1>Bệnh Viện Đa Khoa</h1>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-chart-line"></i>
                        Tổng quan
                    </a>
                    <a href="queue.html" class="nav-link">
                        <i class="fas fa-users"></i>
                        Hàng đợi
                    </a>
                    <a href="appointments.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i>
                        Lịch hẹn
                    </a>
                    <a href="departments.html" class="nav-link active">
                        <i class="fas fa-building"></i>
                        Khoa phòng
                    </a>
                    <a href="users.html" class="nav-link" id="user-nav-link">
                        <i class="fas fa-user-cog"></i>
                        Người dùng
                    </a>
                </nav>
                <div class="user-menu">
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="current-user"></span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="section active">
                <div class="section-header">
                    <h2>Quản lý khoa/phòng</h2>
                    <p>Thêm, sửa, xóa thông tin các khoa/phòng trong bệnh viện một cách dễ dàng</p>
                </div>

                <div class="departments-controls">
                    <div class="controls-header">
                        <div class="controls-title">
                            <i class="fas fa-filter"></i>
                            Tìm kiếm và lọc
                        </div>
                        <div class="departments-actions" id="departments-actions">
                            <button class="btn btn-primary" onclick="showCreateDepartmentModal()">
                                <i class="fas fa-plus"></i>
                                Thêm khoa mới
                            </button>
                        </div>
                    </div>

                    <div class="departments-filters">
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-search"></i>
                                Tìm kiếm theo tên khoa
                            </label>
                            <input type="text" id="filter-dept-name" class="filter-input" placeholder="Nhập tên khoa để tìm kiếm...">
                            <i class="fas fa-search filter-icon"></i>
                        </div>
                        <div class="filter-stats">
                            <i class="fas fa-info-circle"></i>
                            <span id="departments-count">Đang tải...</span>
                        </div>
                    </div>
                </div>

                <div class="departments-container">
                    <div class="table-header">
                        <div class="table-title">
                            <i class="fas fa-hospital"></i>
                            Danh sách khoa/phòng
                        </div>
                        <div class="table-stats" id="table-stats">
                            <i class="fas fa-clock"></i>
                            Cập nhật: <span id="last-update">--:--</span>
                        </div>
                    </div>

                    <div class="departments-grid" id="departments-grid">
                        <div class="empty-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <h3>Đang tải dữ liệu</h3>
                            <p>Vui lòng đợi trong giây lát...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal tạo khoa -->
    <div id="create-department-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-plus"></i>
                    Thêm khoa mới
                </h3>
                <button class="modal-close" onclick="closeModal('create-department-modal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="department-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name" class="form-label">
                                <i class="fas fa-hospital"></i>
                                Tên khoa <span style="color: var(--error);">*</span>
                            </label>
                            <input type="text" id="name" class="form-input" placeholder="Nhập tên khoa" required>
                        </div>

                        <div class="form-group">
                            <label for="type" class="form-label">
                                <i class="fas fa-tags"></i>
                                Loại khoa <span style="color: var(--error);">*</span>
                            </label>
                            <input type="text" id="type" class="form-input" placeholder="Ví dụ: Nội khoa, Ngoại khoa..." required>
                        </div>

                        <div class="form-group">
                            <label for="location" class="form-label">
                                <i class="fas fa-map-marker-alt"></i>
                                Vị trí
                            </label>
                            <input type="text" id="location" class="form-input" placeholder="Ví dụ: Tòa A, Khu B...">
                        </div>

                        <div class="form-group">
                            <label for="floor" class="form-label">
                                <i class="fas fa-layer-group"></i>
                                Tầng
                            </label>
                            <input type="text" id="floor" class="form-input" placeholder="Ví dụ: Tầng 2, Tầng 3...">
                        </div>

                        <div class="form-group">
                            <label for="room" class="form-label">
                                <i class="fas fa-door-open"></i>
                                Số phòng
                            </label>
                            <input type="text" id="room" class="form-input" placeholder="Ví dụ: Phòng 201, 202...">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="description" class="form-label">
                            <i class="fas fa-align-left"></i>
                            Mô tả
                        </label>
                        <textarea id="description" class="form-textarea" rows="4" placeholder="Mô tả chi tiết về khoa/phòng (tùy chọn)"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('create-department-modal')">
                            <i class="fas fa-times"></i>
                            Hủy bỏ
                        </button>
                        <button type="submit" class="btn btn-primary" id="submit-department-btn">
                            <i class="fas fa-check"></i>
                            Thêm khoa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Enhanced departments management with animations and better UX
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        
        if (!token) window.location.href = 'login.html';
        
        document.getElementById('current-user').innerText = role ? role.charAt(0).toUpperCase() + role.slice(1) : '';

        // Role-based UI adjustments
        if (role !== 'admin' && role !== 'doctor') {
            const userNav = document.getElementById('user-nav-link');
            if (userNav) {
                userNav.innerHTML = '<i class="fas fa-user"></i> Thông tin cá nhân';
            }
        }

        // Hide create department button and queue nav based on role
        if (role === 'patient') {
            const actionsContainer = document.getElementById('departments-actions');
            if (actionsContainer) actionsContainer.style.display = 'none';
            
            const nav = document.querySelector('.nav');
            if (nav) {
                const queueLink = nav.querySelector('a[href="queue.html"]');
                if (queueLink) queueLink.style.display = 'none';
            }
        }

        // Hide create button for unauthorized roles
        if (role !== 'admin' && role !== 'receptionist' && role !== 'doctor') {
            const actionsContainer = document.getElementById('departments-actions');
            if (actionsContainer) actionsContainer.style.display = 'none';
        }

        let departmentsData = [];

        // Enhanced toast notification
        function showToast(message, type = 'info', duration = 3000) {
            // Remove existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-times-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `
                <i class="${icons[type] || icons.info}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Enhanced load departments with better UI feedback
        async function loadDepartments() {
            try {
                const response = await fetch('http://localhost:8000/departments', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                departmentsData = data;

                // Apply filters
                const nameFilter = document.getElementById('filter-dept-name').value.trim().toLowerCase();
                const filtered = data.filter(d => {
                    if (nameFilter && !d.Name.toLowerCase().includes(nameFilter)) return false;
                    return true;
                });

                renderDepartmentsTable(filtered);
                updateDepartmentsCount(filtered.length, data.length);
                updateLastUpdate();
                
            } catch (error) {
                console.error('Error loading departments:', error);
                showToast('Lỗi khi tải danh sách khoa/phòng!', 'error');
                
                const grid = document.getElementById('departments-grid');
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Không thể tải dữ liệu</h3>
                        <p>Vui lòng thử lại sau</p>
                    </div>
                `;
            }
        }

        // Enhanced table rendering with animations
        function renderDepartmentsTable(data) {
            const grid = document.getElementById('departments-grid');
            
            if (!data || data.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-hospital"></i>
                        <h3>Không có khoa/phòng nào</h3>
                        <p>Chưa có khoa/phòng nào phù hợp với bộ lọc hiện tại</p>
                    </div>
                `;
                return;
            }

            let tableHtml = `
                <table class='dept-table'>
                    <thead>
                        <tr>
                            <th><i class="fas fa-hospital"></i> Tên khoa</th>
                            <th><i class="fas fa-tags"></i> Loại</th>
                            <th><i class="fas fa-map-marker-alt"></i> Vị trí</th>
                            <th><i class="fas fa-layer-group"></i> Tầng</th>
                            <th><i class="fas fa-door-open"></i> Số phòng</th>
                            <th><i class="fas fa-align-left"></i> Mô tả</th>
                            ${role === 'admin' || role === 'doctor' ? '<th><i class="fas fa-cogs"></i> Thao tác</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(d => {
                tableHtml += `
                    <tr>
                        <td><span class="dept-name">${d.Name}</span></td>
                        <td>${d.Type ? `<span class="dept-type">${d.Type}</span>` : '-'}</td>
                        <td>
                            <div class="dept-location">
                                <i class="fas fa-map-pin"></i>
                                ${d.Location || '-'}
                            </div>
                        </td>
                        <td>${d.Floor || '-'}</td>
                        <td>${d.RoomNumber || '-'}</td>
                        <td>${d.Description || '-'}</td>
                        ${role === 'admin' || role === 'doctor' ? `
                            <td>
                                <div class="dept-actions">
                                    <button class="btn btn-success btn-sm" onclick="editDepartment(${d.DepartmentId})" title="Chỉnh sửa">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteDepartment(${d.DepartmentId})" title="Xóa">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        ` : ''}
                    </tr>
                `;
            });

            tableHtml += '</tbody></table>';
            grid.innerHTML = tableHtml;
        }

        // Update departments count
        function updateDepartmentsCount(filtered, total) {
            const countEl = document.getElementById('departments-count');
            countEl.textContent = `Hiển thị ${filtered} / ${total} khoa/phòng`;
        }

        // Update last update time
        function updateLastUpdate() {
            const lastUpdate = document.getElementById('last-update');
            lastUpdate.textContent = new Date().toLocaleTimeString('vi-VN');
        }

        // Filter change handler with debounce
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        document.getElementById('filter-dept-name').addEventListener('input', debounce(loadDepartments, 300));

        // Modal functions
        function showCreateDepartmentModal() {
            const modal = document.getElementById('create-department-modal');
            modal.classList.add('active');
            document.getElementById('department-form').reset();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // Enhanced form submission
        document.getElementById('department-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-department-btn');
            const originalBtnContent = submitBtn.innerHTML;
            
            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Đang thêm...';
            
            const formData = {
                Name: document.getElementById('name').value.trim(),
                Type: document.getElementById('type').value.trim(),
                Description: document.getElementById('description').value.trim(),
                Location: document.getElementById('location').value.trim(),
                Floor: document.getElementById('floor').value.trim(),
                RoomNumber: document.getElementById('room').value.trim()
            };

            try {
                const response = await fetch('http://localhost:8000/departments', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': 'Bearer ' + token 
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    closeModal('create-department-modal');
                    await loadDepartments();
                    showToast('Thêm khoa/phòng thành công!', 'success');
                } else {
                    const error = await response.json();
                    showToast(error.detail || 'Lỗi khi thêm khoa/phòng!', 'error');
                }
            } catch (error) {
                console.error('Error creating department:', error);
                showToast('Lỗi kết nối máy chủ!', 'error');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
            }
        });

        // Placeholder functions for edit and delete (to be implemented)
        function editDepartment(id) {
            showToast('Chức năng chỉnh sửa đang được phát triển!', 'info');
        }

        function deleteDepartment(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa khoa/phòng này?')) return;
            showToast('Chức năng xóa đang được phát triển!', 'info');
        }

        // Logout function
        function logout() {
            localStorage.clear();
            showToast('Đã đăng xuất thành công', 'info');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadDepartments();
            
            // Set up auto-refresh every 30 seconds
            setInterval(loadDepartments, 30000);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // F5 to refresh
            if (e.key === 'F5') {
                e.preventDefault();
                loadDepartments();
            }
            
            // Ctrl+N to create new department (for authorized users)
            if (e.ctrlKey && e.key === 'n' && (role === 'admin' || role === 'doctor' || role === 'receptionist')) {
                e.preventDefault();
                showCreateDepartmentModal();
            }
            
            // Escape to close modal
            if (e.key === 'Escape') {
                closeModal('create-department-modal');
            }
        });

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                closeModal('create-department-modal');
            }
        });

        // Enhanced search functionality
        document.getElementById('filter-dept-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                loadDepartments();
            }
        });
    </script>
</body>
</html>
