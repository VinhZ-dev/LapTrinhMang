<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khoa phòng - Hệ thống bệnh viện</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <span style="font-size:2rem;color:#1976d2;">🏥</span>
          <h1>Bệnh Viện Đa Khoa</h1>
        </div>
        <nav class="nav">
          <a href="index.html" class="nav-link">Tổng quan</a>
          <a href="queue.html" class="nav-link">Hàng đợi</a>
          <a href="appointments.html" class="nav-link">Lịch hẹn</a>
          <a href="departments.html" class="nav-link active">Khoa phòng</a>
          <a href="users.html" class="nav-link" id="user-nav-link">Người dùng</a>
        </nav>
        <div class="user-menu">
          <div class="user-info">
            <span id="current-user"></span>
          </div>
          <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="container">
      <section class="section active">
        <div class="section-header">
          <h2>Quản lý khoa/phòng</h2>
          <p>Thêm, sửa, xóa thông tin các khoa/phòng trong bệnh viện</p>
        </div>
        <div class="departments-actions">
          <button class="btn btn-primary" onclick="showCreateDepartmentModal()">Thêm khoa mới</button>
        </div>
        <div class="departments-filters" style="display:flex;gap:1rem;margin-bottom:1.2rem;align-items:center;">
          <input type="text" id="filter-dept-name" placeholder="Tìm theo tên khoa..." style="padding:0.5rem 0.8rem;border-radius:7px;border:1.5px solid #cfd8dc;font-size:1.08rem;">
        </div>
        <div class="departments-grid" id="departments-grid"></div>
      </section>
    </div>
  </main>
  <!-- Modal tạo khoa -->
  <div id="create-department-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Thêm khoa mới</h3>
        <button class="modal-close" onclick="closeModal('create-department-modal')">×</button>
      </div>
      <div class="modal-body">
        <form id="department-form">
          <div class="form-group">
            <label for="name">Tên khoa:</label>
            <input id="name" required>
          </div>
          <div class="form-group">
            <label for="type">Loại khoa:</label>
            <input id="type" required>
          </div>
          <div class="form-group">
            <label for="description">Mô tả:</label>
            <textarea id="description"></textarea>
          </div>
          <div class="form-group">
            <label for="location">Vị trí:</label>
            <input id="location">
          </div>
          <div class="form-group">
            <label for="floor">Tầng:</label>
            <input id="floor">
          </div>
          <div class="form-group">
            <label for="room">Số phòng:</label>
            <input id="room">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('create-department-modal')">Hủy</button>
            <button type="submit" class="btn btn-primary">Thêm khoa</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    // Kiểm tra token đăng nhập
    const token = localStorage.getItem('token');
    var role = localStorage.getItem('role');
    if (!token) window.location.href = 'login.html';
    // Xóa hoặc comment dòng sau trong <script>:
    // if (role === 'patient') window.location.href = 'index.html';
    document.getElementById('current-user').innerText = role ? role : '';
    // Sau khi xác định role và token:
    if (role === 'patient') {
      // Ẩn mục Hàng đợi trên nav
      const nav = document.querySelector('.nav');
      if (nav) {
        const queueLink = nav.querySelector('a[href="queue.html"]');
        if (queueLink) queueLink.style.display = 'none';
      }
    }
    // Doctor và admin đều có quyền như nhau
    if (role !== 'admin' && role !== 'receptionist' && role !== 'doctor') {
      document.querySelector('.departments-actions').style.display = 'none';
    }
    // Load danh sách khoa
    function loadDepartments() {
      fetch('http://localhost:8000/departments', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        // Lọc
        const nameFilter = document.getElementById('filter-dept-name').value.trim().toLowerCase();
        const filtered = data.filter(d => {
          if (nameFilter && !d.Name.toLowerCase().includes(nameFilter)) return false;
          return true;
        });
        // Render dạng bảng
        const grid = document.getElementById('departments-grid');
        grid.innerHTML = '';
        if (filtered.length === 0) {
          grid.innerHTML = '<div style="color:#888;">Không có khoa nào phù hợp.</div>';
          return;
        }
        let table = `<table class='dept-table'><thead><tr><th>Tên khoa</th><th>Loại</th><th>Vị trí</th><th>Tầng</th><th>Số phòng</th><th>Mô tả</th></tr></thead><tbody>`;
        filtered.forEach(d => {
          table += `<tr><td style='font-weight:600;color:#1976d2;'>${d.Name}</td><td>${d.Type||''}</td><td>${d.Location||''}</td><td>${d.Floor||''}</td><td>${d.RoomNumber||''}</td><td>${d.Description||''}</td></tr>`;
        });
        table += '</tbody></table>';
        grid.innerHTML = table;
      });
    }
    loadDepartments();
    // Gọi lại loadDepartments khi thay đổi filter
    setTimeout(() => {
      document.getElementById('filter-dept-name').oninput = loadDepartments;
    }, 300);
    // Thêm CSS cho bảng đẹp
    const style = document.createElement('style');
    style.innerHTML = `.dept-table{width:100%;border-collapse:collapse;margin-top:0.5rem;background:#fff;box-shadow:0 2px 12px #1976d220;}
.dept-table th,.dept-table td{border:1px solid #e3eaf6;padding:0.7rem 0.5rem;text-align:left;}
.dept-table th{background:#f5f7fa;color:#1976d2;font-weight:600;}
.dept-table tr:nth-child(even){background:#f8fafc;}`;
    document.head.appendChild(style);
    // Modal tạo khoa
    function showCreateDepartmentModal() {
      document.getElementById('create-department-modal').classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }
    // Xử lý submit tạo khoa
    document.getElementById('department-form').onsubmit = async function(e) {
      e.preventDefault();
      const Name = document.getElementById('name').value;
      const Type = document.getElementById('type').value;
      const Description = document.getElementById('description').value;
      const Location = document.getElementById('location').value;
      const Floor = document.getElementById('floor').value;
      const RoomNumber = document.getElementById('room').value;
      const res = await fetch('http://localhost:8000/departments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ Name, Type, Description, Location, Floor, RoomNumber })
      });
      if (res.ok) {
        closeModal('create-department-modal');
        loadDepartments();
      } else {
        alert('Lỗi khi thêm khoa!');
      }
    };
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
    // Đổi tên nav-link cuối theo quyền nếu cần
    // Khai báo biến role duy nhất ở đầu file
    if (role !== 'admin' && role !== 'doctor') {
      const userNav = document.getElementById('user-nav-link');
      if (userNav) userNav.innerText = 'Thông tin cá nhân';
    }
  </script>
</body>
</html>
