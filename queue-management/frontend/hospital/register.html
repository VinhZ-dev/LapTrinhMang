<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký tài khoản bệnh viện</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(120deg, #e3f0ff 0%, #f5f7fa 100%);
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .register-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px #1976d220;
      padding: 2.5rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.7s cubic-bezier(.23,1.01,.32,1);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .register-container h2 {
      color: #1976d2; font-size: 1.7rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: 1px;
      text-align: center;
    }
    .form-group { width: 100%; margin-bottom: 1.1rem; }
    .form-group label { font-weight: 500; color: #1976d2; margin-bottom: 0.3rem; display: block; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      padding: 0.7rem 1rem;
      border-radius: 7px;
      border: 1px solid #cfd8dc;
      font-size: 1rem;
      transition: border 0.2s, box-shadow 0.2s;
      outline: none;
      background: #f8fafc;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border: 1.5px solid #1976d2; box-shadow: 0 0 0 2px #1976d230;
      background: #fff;
    }
    .form-actions { width: 100%; margin-top: 0.5rem; }
    .btn.btn-primary {
      width: 100%; background: linear-gradient(90deg,#1976d2 60%,#43a047 100%); color: #fff; border: none; border-radius: 7px;
      padding: 0.7rem 0; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 8px #1976d220;
    }
    .btn.btn-primary:hover, .btn.btn-primary:focus {
      background: linear-gradient(90deg,#1565c0 60%,#388e3c 100%); transform: translateY(-2px) scale(1.03);
    }
    #register-error {
      color: #e53935; margin-top: 0.7rem; font-size: 1rem; min-height: 1.2em; text-align: center; transition: opacity 0.3s;
    }
    .register-container a { color: #1976d2; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .register-container a:hover { color: #43a047; }
    @media (max-width: 500px) {
      body { padding: 0; }
      .register-container { max-width: 98vw; padding: 1.2rem 0.5rem; margin: 0; }
      .register-container h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Đăng ký tài khoản bệnh viện</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="username">Tên đăng nhập *</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu *</label>
        <input type="password" id="password" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="fullname">Họ tên *</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <div class="form-group">
        <label for="phone">Điện thoại</label>
        <input type="text" id="phone">
      </div>
      <div class="form-group">
        <label for="dob">Ngày sinh</label>
        <input type="date" id="dob">
      </div>
      <div class="form-group">
        <label for="gender">Giới tính</label>
        <select id="gender">
          <option value="">-- Chọn --</option>
          <option value="Nam">Nam</option>
          <option value="Nữ">Nữ</option>
          <option value="Khác">Khác</option>
        </select>
      </div>
      <div class="form-group">
        <label for="address">Địa chỉ</label>
        <textarea id="address" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Đăng ký</button>
      </div>
    </form>
    <div id="register-error"></div>
    <div style="margin-top:1.2rem; font-size:0.98rem;">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </div>
  </div>
  <script>
    document.getElementById('register-form').onsubmit = async function(e) {
      e.preventDefault();
      const Username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const FullName = document.getElementById('fullname').value.trim();
      const Email = document.getElementById('email').value.trim();
      const Phone = document.getElementById('phone').value.trim();
      const DateOfBirth = document.getElementById('dob').value ? new Date(document.getElementById('dob').value).toISOString() : null;
      const Gender = document.getElementById('gender').value;
      const Address = document.getElementById('address').value.trim();
      const Role = 'patient';
      // Validate cơ bản
      if (!Username || !password || !FullName) {
        document.getElementById('register-error').innerText = 'Vui lòng nhập đầy đủ các trường bắt buộc!';
        return;
      }
      const body = { Username, password, FullName, Email, Phone, DateOfBirth, Gender, Address, Role };
      const res = await fetch('http://localhost:8000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        alert('Đăng ký thành công! Vui lòng đăng nhập.');
        window.location.href = 'login.html';
      } else {
        const data = await res.json().catch(() => ({}));
        document.getElementById('register-error').innerText = data.detail || 'Đăng ký thất bại!';
      }
    }
  </script>
</body>
</html>
